services:
  app-dev:
    container_name: gis-pdf-app-dev
    build:
      context: .
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - feature_images:/usr/src/app/feature_images  # Add this line
    ports:
      - "1000:1000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - NODEMON_LEGACY_WATCH=true
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    command: nodemon --inspect=0.0.0.0:9229 --legacy-watch app.js
    env_file: .env.development

  app-prod:
    container_name: gis-pdf-app-prod
    build:
      context: .
      target: production
    volumes:
      - feature_images:/usr/src/app/feature_images  # Add this line
    ports:
      - "1000:1000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthcheck', (r) => process.exit(r.statusCode > 299))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    env_file: .env.production

# Add volumes definition
volumes:
  feature_images: